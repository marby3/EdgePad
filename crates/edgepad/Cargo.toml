[package]
name = "edgepad"
description = "Edge keypad for Windows: macro keys on the screen edges for touch and mouse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
edgepad-core = { path = "../core" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Test-only hooks (messages that panic, fail a send, or change the settings
# window's copy of the file). Never enabled in release builds.
fault-injection = []

[dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Controls"] }
