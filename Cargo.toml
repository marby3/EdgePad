[workspace]
members = ["crates/core", "crates/edgepad"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
repository = "https://github.com/marby3/EdgePad"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The tests drive the real exe: a debug build draws the settings window
# slowly enough to slow every test of it (Issue #123). Checks stay on.
[profile.dev]
opt-level = 1
