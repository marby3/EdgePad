flick = right | ー | kana | ー
key = 、   | kana     | 、    | x=2, y=3
flick = left  | 。 | kana | 。
flick = up    | ？ | kana | ？
flick = right | ！ | kana | ！
key = ⌫    | shortcut | Backspace | x=3, y=0
key = 空白 | shortcut | Space     | x=3, y=1   ; かなを打った後は漢字に変換
