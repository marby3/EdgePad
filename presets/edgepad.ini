[set.kana]   ; かなのフリック入力（スマートフォンの 12 キー。どのエッジにも出していない）
; かなはローマ字のキー操作で送るので、IME をオンにして使う（Space で漢字に変換）。
; キーを左・上・右・下に払うと い・う・え・お の段。゛゜小 は直前のかなを が・ぱ・っ などに変える。
layout = free
key = あ   | kana     | あ    | x=0, y=0
flick = left  | い | kana | い
flick = up    | う | kana | う
flick = right | え | kana | え
flick = down  | お | kana | お
key = か   | kana     | か    | x=1, y=0
flick = left  | き | kana | き
flick = up    | く | kana | く
flick = right | け | kana | け
flick = down  | こ | kana | こ
key = さ   | kana     | さ    | x=2, y=0
flick = left  | し | kana | し
flick = up    | す | kana | す
flick = right | せ | kana | せ
flick = down  | そ | kana | そ
key = た   | kana     | た    | x=0, y=1
flick = left  | ち | kana | ち
flick = up    | つ | kana | つ
flick = right | て | kana | て
flick = down  | と | kana | と
key = な   | kana     | な    | x=1, y=1
flick = left  | に | kana | に
flick = up    | ぬ | kana | ぬ
flick = right | ね | kana | ね
flick = down  | の | kana | の
key = は   | kana     | は    | x=2, y=1
flick = left  | ひ | kana | ひ
flick = up    | ふ | kana | ふ
flick = right | へ | kana | へ
flick = down  | ほ | kana | ほ
key = ま   | kana     | ま    | x=0, y=2
flick = left  | み | kana | み
flick = up    | む | kana | む
flick = right | め | kana | め
flick = down  | も | kana | も
key = や   | kana     | や    | x=1, y=2
flick = up    | ゆ | kana | ゆ
flick = down  | よ | kana | よ
key = ら   | kana     | ら    | x=2, y=2
flick = left  | り | kana | り
flick = up    | る | kana | る
flick = right | れ | kana | れ
flick = down  | ろ | kana | ろ
key = ゛゜小 | kana     | ゛゜小 | x=0, y=3
key = わ   | kana     | わ    | x=1, y=3
flick = left  | を | kana | を
