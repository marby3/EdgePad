; EdgePad の既定の設定（同梱のプリセット、Issue #127）。
; 書き方は設定リファレンスを見てください。保存すると、EdgePad がすぐに読み直します。
;
; 左エッジ: CLIP STUDIO PAINT 向けのキー。下のエッジ: キーボード（起動した時は隠れていて、
; 下のエッジのハンドルで出す）。キーボードは US 配列のほかに 3 つあり、
; 設定画面の「アプリ別」で下のエッジに選べます。

[general]
theme = auto

[edge.bottom]
start = hidden               ; 起動した時は隠しておく

[set.csp]                    ; CLIP STUDIO PAINT 向け（左エッジ）
key = Esc    | shortcut | Esc
; フリック: 上に払うと元に戻す、下に払うとやり直し。キーの近い親戚の操作を、そのキーから
; 手早く出すのに向く（1 キーに上下左右の 4 つまで）。数の多い仲間の操作（変形や選択範囲の
; いろいろ）をまとめるなら、別のキーセットを項目にしたパイメニュー（kind = pie）が向く。
flick = up   | 元に戻す | shortcut | Ctrl+Z
flick = down | やり直し | shortcut | Ctrl+Y
space = 1                            ; 空き 1 キー分
key = P      | shortcut | P
key = B      | shortcut | B
key = E      | shortcut | E
key = X      | shortcut | X
key = /      | shortcut | /
key = [      | repeat   | [           ; ブラシを小さく（押している間くり返す）
key = ]      | repeat   | ]           ; ブラシを大きく（押している間くり返す）
key = Ctrl   | modifier | Ctrl
key = Shift  | modifier | Shift


