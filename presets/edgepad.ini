; EdgePad の既定の設定（同梱のプリセット、Issue #127）。
; 書き方は設定リファレンスを見てください。保存すると、EdgePad がすぐに読み直します。
;
; 左辺: CLIP STUDIO PAINT 向けのキー。下の辺: キーボード（起動した時は隠れていて、
; 下の辺のハンドルで出す）。キーボードは US 配列のほかに 3 つあり、
; 設定画面の「アプリ別」で下の辺に選べます。

[general]
theme = auto

[edge.bottom]
start = hidden               ; 起動した時は隠しておく

[set.csp]                    ; CLIP STUDIO PAINT 向け（左辺）
key = Esc    | shortcut | Esc
key = ​      | none     | -           ; 空き 1 キー分（見えないラベル）
key = P      | shortcut | P
key = B      | shortcut | B
key = E      | shortcut | E
key = X      | shortcut | X
key = /      | shortcut | /
key = [      | repeat   | [           ; ブラシを小さく（押している間くり返す）
key = ]      | repeat   | ]           ; ブラシを大きく（押している間くり返す）
key = Ctrl   | modifier | Ctrl
key = Shift  | modifier | Shift


