name: Release

# A version tag (pushed by the release script, which makes the Release)
# builds the exe and attaches the zip of it and what goes beside it
# (ci/package.py) to that tag's Release (Issue #79). The exe goes in
# unsigned (Issue #147).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag
        run: python ci/package.py --check ${{ github.ref_name }}
      - name: Build
        run: cargo build --release
      - name: Zip
        run: >-
          python ci/package.py --tag ${{ github.ref_name }} --out dist
          --exe target/release/edgepad.exe
      - name: Attach to the Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Made by the release script as a rule; made here if it is not.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip --clobber
