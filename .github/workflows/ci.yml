name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: Release build checks (size, static CRT, GUI subsystem)
        run: python -m unittest -v ci/test_build.py
