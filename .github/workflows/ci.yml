name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cargo test
        run: cargo test --workspace --all-features -- --nocapture
        env:
          EDGEPAD_DIAG: ${{ runner.temp }}
      - name: TEMPORARY diagnostics for #12
        if: failure()
        shell: bash
        run: for f in "$RUNNER_TEMP"/edgepad-diag-*.log; do echo "== $f"; cat "$f"; done
      - name: Release build checks (size, static CRT, GUI subsystem)
        run: python -m unittest -v ci/test_build.py ci/test_measure.py
