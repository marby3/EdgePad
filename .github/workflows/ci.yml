name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests, and once more each one that failed: the settings window's
      # drive a desktop no one is at, and now and then fail by chance. One
      # that passes the second time is named in a warning (Issue #123).
      - name: cargo test
        run: python ci/retry.py
      # Each failing test's panic as an annotation, readable from the PR
      # without opening the log. Ten per step at most; --no-fail-fast runs
      # every test binary, so all of them can show.
      - name: Report failed tests
        if: failure()
        shell: bash
        run: |
          # tests/tray.rs makes EdgePad panic on purpose: those are no failure.
          awk '/panicked at|^error(\[|:)/ { msg = $0; while ((getline line) > 0 && line != "" && line !~ /^note:/) msg = msg "%0A" line; if (msg !~ /fault injection|panicking\.rs/) print "::error::" msg }' test-output.txt | head -10
      - name: Release build checks (size, static CRT, GUI subsystem)
        run: python -m unittest -v ci/test_build.py ci/test_measure.py ci/test_retry.py ci/test_release.py
